<style>
:root{
  --paper:#EDF0F5; --surface:#FFFFFF; --ink:#16233B; --muted:#5B6880; --line:#D5DBE5;
  --up:#089981; --down:#E5364A; --vwap:#C98A1E; --up-soft:#E0F3EF; --down-soft:#FCE5E8;
  --focus:#2F6FEB;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0F1726; --surface:#18223A; --ink:#E6EBF4; --muted:#93A0B8; --line:#2A3654;
    --up:#22B39A; --down:#F05467; --vwap:#EBB04A; --up-soft:#133B39; --down-soft:#3B1D28;
    --focus:#7FA6FF;
    color-scheme: dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:"Barlow",system-ui,sans-serif;font-size:17px;line-height:1.5;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.app{max-width:480px;margin:0 auto;padding:20px 18px 110px}
.num{font-family:"Barlow Condensed","Barlow",sans-serif;font-weight:700;letter-spacing:.01em}
h1{font-family:"Barlow Condensed","Barlow",sans-serif;font-weight:700;font-size:40px;line-height:1.05;letter-spacing:-.005em}
h2{font-size:20px;font-weight:600;line-height:1.3}
.sub{color:var(--muted);margin-top:6px}
.muted{color:var(--muted)}
.small{font-size:14px}

.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 14px 8px;margin:22px 0 18px}
.chart-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px;padding:0 4px}
.chart svg{width:100%;height:auto;display:block}
.candle{cursor:pointer}
.candle:focus-visible{outline:none}
.candle:focus-visible .wick{stroke:var(--focus);stroke-width:3}

.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border-radius:12px;font-weight:600;font-size:18px;padding:12px 18px}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-ghost{border:1.5px solid var(--line);margin-top:10px;background:var(--surface)}
.btn-row{display:flex;gap:10px;margin-top:10px}
.btn-row .btn{margin-top:0}
.foot-note{margin-top:20px;color:var(--muted);font-size:15px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:4px;z-index:5}
nav.tabs button{flex:1;max-width:150px;min-height:48px;border-radius:10px;font-weight:600;font-size:15px;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--ink);background:var(--paper)}

.topic-list{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.topic{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.topic-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.topic-name{font-weight:600;font-size:18px}
.topic-desc{color:var(--muted);font-size:15px;margin-top:2px}
.meter{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.meter span{display:block;height:100%;border-radius:3px}

.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--muted);font-weight:600;margin:-6px 0 6px -4px;padding:0 4px}
.lesson-diag{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin:18px 0 6px}
.lesson-diag svg{width:100%;height:auto;display:block}
.points{list-style:none;margin:18px 0 22px}
.points li{position:relative;padding:12px 0 12px 22px;border-bottom:1px solid var(--line)}
.points li:last-child{border-bottom:0}
.points li::before{content:"";position:absolute;left:4px;top:19px;width:6px;height:12px;border-radius:1px;background:var(--up)}
.points li.warn::before{background:var(--down)}
.points b{font-weight:600}

.train-top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.close{width:44px;height:44px;border-radius:10px;font-size:26px;line-height:1;color:var(--muted);flex:none}
.bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--ink);transition:width .25s}
.count{font-size:15px;color:var(--muted);min-width:44px;text-align:right}
.tag{display:inline-block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:8px}
.q{font-size:22px;font-weight:600;line-height:1.35;margin-bottom:20px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:15px 16px;min-height:56px;font-size:17px;line-height:1.35}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--up);background:var(--up-soft)}
.opt.wrong{border-color:var(--down);background:var(--down-soft)}
.opt.dim{opacity:.55}
.feedback{margin-top:18px;border-radius:12px;padding:16px;border-left:4px solid var(--up);background:var(--surface)}
.feedback.bad{border-left-color:var(--down)}
.feedback h3{font-size:18px;font-weight:700;margin-bottom:4px}
.feedback p{color:var(--ink)}
@media (prefers-reduced-motion: no-preference){
  .feedback{animation:rise .2s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}

.score{font-size:72px;line-height:1;margin:24px 0 6px}
.missed{margin:20px 0}
.missed li{margin-left:20px;padding:4px 0}

.rows{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 16px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .meter{grid-column:1 / -1;margin-top:2px}
.section-title{margin-top:28px}
.spark{display:flex;align-items:flex-end;gap:5px;height:80px;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.spark span{flex:1;min-width:6px;border-radius:2px 2px 0 0}
.danger{color:var(--down);border-color:var(--down)}
.empty{margin-top:12px;color:var(--muted)}
.notice{margin-top:14px;padding:12px 14px;border-radius:10px;border-left:4px solid var(--vwap);background:var(--surface);font-size:15px}
.backup textarea{width:100%;margin-top:10px;min-height:84px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:14px/1.4 ui-monospace,Menlo,monospace;padding:10px;resize:vertical;word-break:break-all}
.backup .status{margin-top:8px;font-size:15px}
</style>
</head>
<body>
<div class="app" id="app" aria-live="polite"></div>
<nav class="tabs" id="tabs" aria-label="Sections">
  <button data-action="tab" data-tab="home">Today</button>
  <button data-action="tab" data-tab="learn">Learn</button>
  <button data-action="tab" data-tab="progress">Progress</button>
</nav>

<script>
/* ---------- helpers ---------- */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
const money=n=>'$'+(Number.isInteger(n)?n.toLocaleString('en-US'):n.toFixed(2));
const px=n=>n.toLocaleString('en-US',{maximumFractionDigits:2});
const fR=r=>(r>0?'+':'')+r+'R';
const signed=n=>(n>0?'+':'')+n;
const DAY=864e5;
const INTERVALS=[0,0,1,3,7,16,35];

/* ---------- topics ---------- */
const TOPICS=[
  {id:'math',name:'Money math',short:'Math',desc:'Points, ticks and dollars on MNQ'},
  {id:'orb',name:'Opening range breakout',short:'ORB',desc:'The box, the break, the stop'},
  {id:'vwap',name:'VWAP mean reversion',short:'VWAP',desc:'Fair price and fading the stretch'},
  {id:'risk',name:'Risk and sizing',short:'Risk',desc:'Stops, contracts, loss limits'},
  {id:'journal',name:'R and the journal',short:'R',desc:'R multiples, expectancy, honest logging'},
  {id:'session',name:'The open',short:'Open',desc:'When the session starts on your clock'}
];
const topicById=id=>TOPICS.find(t=>t.id===id);

/* ---------- generated questions ---------- */
function rGen(side){
  return ()=>{
    const e=30000+rnd(0,300)*5, risk=pick([10,12,15,20,25,30,40]), R=pick([2,1.5,3,1,-1,0.5]);
    const stop=side==='long'?e-risk:e+risk, exit=side==='long'?e+R*risk:e-R*risk, res=R*risk;
    const why=side==='long'
      ? `Long: risk = entry − stop = ${risk} pts. Result = exit − entry = ${signed(res)} pts. ${res} ÷ ${risk} = ${fR(R)}.`
      : `A short makes money when price falls. Risk = stop − entry = ${risk} pts. Result = entry − exit = ${signed(res)} pts. ${res} ÷ ${risk} = ${fR(R)}.`;
    return {q:`${side==='long'?'Long':'Short'} trade. Entry ${px(e)}, stop ${px(stop)}, exit ${px(exit)}. What's the R multiple?`,
      opts:[fR(R),fR(-R),fR(R*2),fR(res)],answer:fR(R),why};
  };
}
const GEN={
  pnl:()=>{const p=rnd(6,60),c=rnd(1,3),ok=p*2*c;
    return {q:`You catch a ${p}-point move on ${c} MNQ contract${c>1?'s':''}. What's the P&L?`,
      opts:[money(ok),money(p*0.5*c),money(p*20*c),money(c>1?p*2:p*4)],answer:money(ok),
      why:`${p} points × $2 × ${c} = ${money(ok)}. MNQ is $2 a point per contract. $0.50 is one tick; $20 a point is the big NQ.`};},
  ticks:()=>{const t=rnd(3,40),ok=t*0.5;
    return {q:`MNQ moves ${t} ticks against you on 1 contract. How much did you lose?`,
      opts:[money(ok),money(t*2),money(t*0.25),money(t*5)],answer:money(ok),
      why:`1 tick = $0.50 on MNQ, so ${t} × $0.50 = ${money(ok)}. Same thing as ${t/4} points × $2.`};},
  riskUsd:()=>{const e=30000+rnd(0,300)*5,d=pick([15,20,25,30,35,40,50]),c=rnd(1,2),ok=d*2*c;
    return {q:`ORB long. Entry ${px(e)}, range low (your stop) ${px(e-d)}, ${c} contract${c>1?'s':''}. How much are you risking?`,
      opts:[money(ok),money(d*c),money(d*0.5*c),money(d*20*c)],answer:money(ok),
      why:`Stop distance is ${d} points. ${d} × $2 × ${c} = ${money(ok)}. Know this number before you click.`};},
  size:()=>{const max=pick([50,60,80,100,120,150]),d=pick([15,20,25,30,40,50,60,80]),per=d*2,n=Math.floor(max/per);
    const skip='Skip it — even 1 contract is too much';
    const nums=n>3?[String(n-2),String(n-1),String(n)]:['1','2','3'];
    return {q:`Your max risk per trade is ${money(max)}. Today's ORB stop is ${d} points away. How many MNQ contracts?`,
      opts:[skip,...nums],answer:n===0?skip:String(n),ordered:true,
      why:n===0
        ?`1 contract already risks ${d} × $2 = ${money(per)}, over your ${money(max)} limit. Tall box means skip the day. The stop stays where the chart puts it.`
        :`1 contract risks ${d} × $2 = ${money(per)}. ${money(max)} ÷ ${money(per)} = ${(max/per).toFixed(2)}, round down to ${n}. Size is the dial; the stop doesn't move.`};},
  longR:rGen('long'),
  shortR:rGen('short')
};

/* ---------- card bank ---------- */
const S=(id,topic,q,opts,why)=>({id,topic,q,opts,answer:opts[0],why});
const G=(id,topic,gen)=>({id,topic,gen});
const CARDS=[
  G('g_pnl','math',GEN.pnl), G('g_ticks','math',GEN.ticks),
  S('m_tick','math','How many ticks make 1 MNQ point?',['4','2','10','1'],'A tick is 0.25 points, so 4 ticks make a point. On MNQ: 1 tick = $0.50, 1 point = $2.'),
  S('m_nq','math','MNQ vs NQ — what\'s the difference?',['NQ is 10× bigger: $20 a point vs $2','Same contract, different name','MNQ is the bigger one','NQ is $5 a point, MNQ is $2'],'MNQ is the micro: $2 a point, $0.50 a tick. NQ is full size: $20 a point, $5 a tick. Learning on MNQ means every mistake costs a tenth.'),
  S('m_line','math','The one-line P&L formula for MNQ?',['points × $2 × contracts','ticks × $2 × contracts','points × $5 × contracts','points × contracts'],'Points × $2 × contracts. If you think in ticks instead: ticks × $0.50 × contracts.'),

  S('o_candles','orb','On a 5-minute chart, how many candles make the 15-minute opening range?',['3','5','15','1'],'15 minutes ÷ 5 = 3 candles. Box those three, then stop drawing.'),
  S('o_edges','orb','Where do the box edges go?',['Exactly on the highest wick and lowest wick of those 3 candles','A bit above and below, for breathing room','On the bodies of the first candle only','Wherever looks like support and resistance'],'The box edges ARE your levels. If they float above or below the candles, you\'re trading prices nobody hit.'),
  S('o_long','orb','A candle closes above the range high. Signal?',['Long, stop below the range low','Short — the high is resistance','Long, stop 10 points under entry','Nothing until it comes back into the box'],'ORB trades with the break. Close above = long. Stop on the far side of the box: the range low.'),
  S('o_short','orb','A candle closes below the range low. Signal?',['Short, stop above the range high','Long — the low is support','Short, stop just under the range low','Wait for a retest first'],'Mirror of the long. Close below = short. Stop on the far side: above the range high.'),
  S('o_wick','orb','A wick pokes above the range high, but the candle closes back inside the box. Go long?',['No — no close outside, no signal','Yes, the high broke','Yes, with half size','Go short instead'],'Wicks get faked all day. The signal is a candle that closes outside the box.'),
  S('o_whystop','orb','Why does the ORB stop sit on the far side of the box?',['If price goes back through the whole box, the breakout failed','It makes the stop as small as possible','VWAP is usually there','So risk is always 10 points'],'A stop marks where your idea is proven wrong. Price wiggling back into the box isn\'t proof. Going all the way through it is.'),
  S('o_tall','orb','Huge opening range today — the stop would be 70 points away. What now?',['Fewer contracts, or skip the day','Move the stop closer','Take it and accept the bigger loss','Use a fixed 20-point stop'],'The stop is set by the chart. Size is the only dial. If 1 contract is still too much, today isn\'t your day.'),
  S('o_with','orb','ORB trades ___ the breakout.',['with','against','after fading','half of'],'Breakout, not fade. You\'re betting the move out of the box keeps going.'),

  S('v_def','vwap','What is VWAP?',['Average traded price, weighted by volume','Midpoint of the day\'s high and low','Average of the last 20 closes','The price with the most open contracts'],'Volume Weighted Average Price. Prices where lots of contracts traded pull it harder — it\'s where the money actually changed hands today.'),
  S('v_ma','vwap','VWAP vs a 20-period moving average — the key difference?',['VWAP weights by volume; the MA treats every bar equally','VWAP is just smoother','VWAP only uses closes','No real difference'],'A 10-contract bar and a 10,000-contract bar count the same in an MA. Not in VWAP.'),
  S('v_reset','vwap','When does VWAP start fresh?',['Every new session','Every week','Never','Every hour'],'Session VWAP resets at the start of each session. It describes today only.'),
  S('v_above','vwap','Price ran far above VWAP and is stalling. Mean-reversion play?',['Short, targeting VWAP','Long — momentum continues','Wait for it to reach VWAP, then short','Long once it closes below VWAP'],'Mean reversion bets the stretch snaps back. Far above + stalling = short back toward VWAP.'),
  S('v_below','vwap','Price dumped far below VWAP and is stalling. Mean-reversion play?',['Long, targeting VWAP','Short — it\'s weak','Short once it reaches VWAP','Never trade below VWAP'],'Mirror of the short. Far below + stalling = long back toward VWAP.'),
  S('v_target','vwap','In a VWAP mean-reversion trade, what\'s the natural target?',['VWAP itself','The opening range high','Always 2R','The day\'s high'],'You\'re betting on a return to fair price. Fair price is VWAP.'),
  S('v_stall','vwap','Why wait for the stall before fading a move away from VWAP?',['A strong push can keep going — fading it early is standing in front of a train','Stalls always happen at 2R','VWAP only updates during stalls','You don\'t need to wait'],'Stretched isn\'t enough. You want proof the push is running out of fuel first.'),
  S('v_orb','vwap','ORB vs VWAP mean reversion — how do they relate?',['Opposite logic: ORB goes with the move, VWAP reversion fades it','Same strategy, different names','Both fade the move','Both only trade above VWAP'],'Know which one you\'re in before you click. Mixing them mid-trade is how people get chopped up.'),

  G('g_riskUsd','risk',GEN.riskUsd), G('g_size','risk',GEN.size),
  S('r_dial','risk','Your stop feels too expensive. Which dial do you turn?',['Size — fewer contracts','The stop — move it closer','Both','Neither, just take it'],'Two dials: stop and size. The chart sets the stop. You only ever touch size.'),
  S('r_widen','risk','Trade going against you, nearing your stop. Move the stop further away?',['Never','Yes, give it room','Once per trade is fine','Yes if VWAP is close'],'Moving a stop further away is turning a planned small loss into an unplanned big one.'),
  S('r_daily','risk','You hit your daily loss limit. Now what?',['Done for the day','One more to win it back','Double size to recover faster','Switch strategies'],'The limit exists for exactly the moment you want to break it.'),
  S('r_pct','risk','Rough max risk per trade while learning?',['1% of the account or less','5%','10%','Whatever feels right'],'Small enough that ten losses in a row hurt but don\'t end you.'),

  G('g_longR','journal',GEN.longR), G('g_shortR','journal',GEN.shortR),
  S('j_R','journal','What does +2R mean?',['You made twice what you risked','You made $2','You won 2 trades','You risked 2%'],'R = result ÷ risk. +2R = double your risk. −1R = full stop-out.'),
  S('j_N','journal','You break your rules and the trade wins. How do you log it?',['Followed rules: N','Followed rules: Y, it worked','Don\'t log it','Log it but leave it out of stats'],'A rule-break that wins is the most dangerous trade — it pays you for bad habits. Log N.'),

/* ---------- state ---------- */
const STORE_KEY='mnq-trainer-v1';
let state={cards:{},sessions:[]};
let view={tab:'home',screen:'home',topic:null,train:null,confirmReset:false};
const getC=id=>state.cards[id]||{box:0,due:0,right:0,wrong:0,hist:[]};
/* Storage: Claude storage if it works, else the phone's own storage, else memory only (with a backup code). */
let storeMode='memory', saveTimer;
async function detectStore(){
  if(window.storage){
    try{ const r=await window.storage.set('probe','1',false); if(r){ storeMode='claude'; return; } }catch(e){}
  }
  try{ localStorage.setItem('mnq_probe','1'); localStorage.removeItem('mnq_probe'); storeMode='local'; return; }catch(e){}
  storeMode='memory';
}
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    const v=JSON.stringify(state);
    try{
      if(storeMode==='claude') await window.storage.set(STORE_KEY,v,false);
      else if(storeMode==='local') localStorage.setItem(STORE_KEY,v);
    }catch(e){ storeMode='memory'; render(); }
  },250);
}
function applyLoaded(raw){
  const s=JSON.parse(raw);
  if(!s||typeof s.cards!=='object') throw new Error('bad data');
  state={cards:s.cards||{},sessions:Array.isArray(s.sessions)?s.sessions:[]};
}
async function load(){
  await detectStore();
  try{
    if(storeMode==='claude'){ const r=await window.storage.get(STORE_KEY,false); if(r&&r.value) applyLoaded(r.value); }
    else if(storeMode==='local'){ const v=localStorage.getItem(STORE_KEY); if(v) applyLoaded(v); }
  }catch(e){ /* nothing saved yet */ }
  render();
}
const backupCode=()=>btoa(JSON.stringify(state));
function grade(id,ok){
  const c=Object.assign({},getC(id)); c.hist=(c.hist||[]).slice();
  if(ok){c.right++;c.box=Math.min(6,c.box+1);}else{c.wrong++;c.box=1;}
  c.due=Date.now()+INTERVALS[c.box]*DAY;
  c.hist.push(ok?1:0); if(c.hist.length>10)c.hist.shift();
  state.cards[id]=c; save();
}

/* ---------- stats ---------- */
function topicStats(tid){
  const cards=CARDS.filter(c=>c.topic===tid);
  let mast=0,right=0,wrong=0,recent=[],seen=0;
  cards.forEach(c=>{const s=getC(c.id);mast+=Math.min(s.box,5)/5;right+=s.right;wrong+=s.wrong;recent=recent.concat(s.hist||[]);if(s.right+s.wrong>0)seen++;});
  const acc=right+wrong?right/(right+wrong):null;
  const rAcc=recent.length?recent.reduce((a,b)=>a+b,0)/recent.length:null;
  return {mastery:mast/cards.length,acc,rAcc,seen,total:cards.length,attempts:right+wrong};
}
function dueCount(){const now=Date.now();return CARDS.filter(c=>{const s=getC(c.id);return s.box>0&&s.due<=now;}).length;}
function newCount(){return CARDS.filter(c=>getC(c.id).box===0).length;}
function weakCount(){return CARDS.filter(c=>{const s=getC(c.id);return s.right+s.wrong>0&&s.box<=2;}).length;}
function dayKey(t){const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function streak(){
  const days=new Set(state.sessions.map(s=>dayKey(s.t)));
  let n=0,d=Date.now();
  if(!days.has(dayKey(d))) d-=DAY;
  while(days.has(dayKey(d))){n++;d-=DAY;}
  return n;
}

/* ---------- picking ---------- */
function pickCards(mode,topic){
  let pool=CARDS.filter(c=>!topic||c.topic===topic);
  const now=Date.now();
  if(mode==='weak'){
    return shuffle(pool.filter(c=>{const s=getC(c.id);return s.right+s.wrong>0&&s.box<=2;})).slice(0,10);
  }
  const due=shuffle(pool.filter(c=>{const s=getC(c.id);return s.box>0&&s.due<=now;})).sort((a,b)=>getC(a.id).box-getC(b.id).box);
  const fresh=shuffle(pool.filter(c=>getC(c.id).box===0));
  const later=shuffle(pool.filter(c=>{const s=getC(c.id);return s.box>0&&s.due>now;})).sort((a,b)=>getC(a.id).due-getC(b.id).due);
  let list=[...due,...fresh,...later].slice(0,10);
  if(topic&&list.length<8){
    const gens=pool.filter(c=>c.gen);
    while(gens.length&&list.length<8) list.push(pick(gens));
  }
  return list;
}
function makeQ(card){
  const b=card.gen?card.gen():card;
  const options=b.ordered?b.opts.slice():shuffle(b.opts);
  return {id:card.id,topic:card.topic,q:b.q,options,correct:options.indexOf(b.answer),why:b.why};
}

/* ---------- render ---------- */
const app=document.getElementById('app'), tabs=document.getElementById('tabs');
function render(){
  tabs.style.display=view.screen==='train'?'none':'flex';
  tabs.querySelectorAll('button').forEach(b=>b.toggleAttribute('aria-current',false));
  const cur=tabs.querySelector(`[data-tab="${view.tab}"]`); if(cur) cur.setAttribute('aria-current','page');
  if(view.screen==='home') app.innerHTML=homeHTML();
  else if(view.screen==='learn') app.innerHTML=learnHTML();
  else if(view.screen==='lesson') app.innerHTML=lessonHTML(view.topic);
  else if(view.screen==='progress') app.innerHTML=progressHTML();
  else if(view.screen==='train') app.innerHTML=trainHTML();
  else if(view.screen==='summary') app.innerHTML=summaryHTML();
}

function chartSVG(){
  const w=330,h=178,base=132,top=22,span=base-top,gap=w/TOPICS.length;
  const stats=TOPICS.map(t=>topicStats(t.id));
  const avg=stats.reduce((a,s)=>a+s.mastery,0)/stats.length;
  const avgY=base-avg*span;
  let g='';
  TOPICS.forEach((t,i)=>{
    const s=stats[i], cx=gap*i+gap/2, bh=Math.max(4,s.mastery*span);
    let col='var(--muted)', fill='none';
    if(s.attempts>0){ col=(s.rAcc!==null&&s.rAcc>=0.7)?'var(--up)':'var(--down)'; fill=col; }
    g+=`<g class="candle" data-action="lesson" data-topic="${t.id}" role="button" tabindex="0" aria-label="${t.name}: ${Math.round(s.mastery*100)}% learned">
      <rect x="${cx-gap/2}" y="0" width="${gap}" height="${h}" fill="transparent"/>
      <line class="wick" x1="${cx}" y1="${top}" x2="${cx}" y2="${base}" stroke="var(--line)" stroke-width="2"/>
      <rect x="${cx-11}" y="${base-bh}" width="22" height="${bh}" rx="2" fill="${fill}" stroke="${col}" stroke-width="1.5"/>
      <text x="${cx}" y="${base+20}" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink)">${t.short}</text>
      <text x="${cx}" y="${base+36}" text-anchor="middle" font-size="12" fill="var(--muted)">${Math.round(s.mastery*100)}%</text>
    </g>`;
  });
  g+=`<line x1="4" y1="${avgY}" x2="${w-4}" y2="${avgY}" stroke="var(--vwap)" stroke-width="1.5" stroke-dasharray="5 4" pointer-events="none"/>
      <text x="${w-4}" y="${avgY-6}" text-anchor="end" font-size="11" fill="var(--vwap)" pointer-events="none">avg ${Math.round(avg*100)}%</text>`;
  return `<svg viewBox="0 0 ${w} ${h}" aria-label="How well you know each topic">${g}</svg>`;
}

function homeHTML(){
  const due=dueCount(), fresh=newCount(), weak=weakCount(), st=streak(), n=state.sessions.length;
  let head,sub;
  if(n===0){head='Start here';sub='Ten quick cards on ORB, VWAP and the money math. Wrong answers come back sooner.';}
  else if(due>0){head=`${due} card${due>1?'s':''} due`;sub=fresh?`Plus ${fresh} you haven't seen yet.`:'Clear them and you\'re done for today.';}
  else if(fresh>0){head='Nothing due';sub=`${fresh} new cards left to learn.`;}
  else {head='All caught up';sub='Come back tomorrow, or drill your weak spots.';}
  const line=n?`${st?`${st}-day streak. `:''}${n} session${n>1?'s':''} done.`:'';
  return `
  <h1>${head}</h1><p class="sub">${sub}</p>
  <section class="chart">
    <div class="chart-head"><h2>Your chart</h2><span class="muted small">tap a candle to relearn</span></div>
    ${chartSVG()}
  </section>
  <button class="btn btn-primary" data-action="train" data-mode="normal">Train 10 cards</button>
  ${weak?`<button class="btn btn-ghost" data-action="train" data-mode="weak">Weak spots (${weak})</button>`:''}
  ${line?`<p class="foot-note">${line}</p>`:''}
  ${storeMode==='memory'?`<p class="notice">Progress can't save in this view. Before closing, copy your backup code from Progress — or use the home-screen version, which saves on its own.</p>`:''}`;
}

function meter(m){const col=m>=0.6?'var(--up)':m>0?'var(--down)':'var(--line)';return `<div class="meter"><span style="width:${Math.max(2,m*100)}%;background:${col}"></span></div>`;}

function trainHTML(){
  const T=view.train, q=T.qs[T.i], answered=T.picked!==null;
  const pct=((T.i+(answered?1:0))/T.qs.length)*100;
  return `<div class="train-top">
      <button class="close" data-action="quit" aria-label="Stop training">×</button>
      <div class="bar"><span style="width:${pct}%"></span></div>
      <span class="count num">${T.i+1}/${T.qs.length}</span>
    </div>
    <span class="tag">${topicById(q.topic).name}</span>
    <p class="q">${q.q}</p>
    <div class="opts">${q.options.map((o,i)=>{
      let cls='opt';
      if(answered){ if(i===q.correct)cls+=' right'; else if(i===T.picked)cls+=' wrong'; else cls+=' dim'; }
      return `<button class="${cls}" data-action="answer" data-i="${i}" ${answered?'disabled':''}>${o}</button>`;}).join('')}</div>
    ${answered?`<div class="feedback ${T.picked===q.correct?'':'bad'}">
      <h3>${T.picked===q.correct?'Right':'Not quite'}</h3><p>${q.why}</p></div>
      <button class="btn btn-primary" style="margin-top:16px" data-action="next">${T.i+1<T.qs.length?'Next':'See results'}</button>`:''}`;
}

function summaryHTML(){
  const T=view.train, total=T.results.length, score=T.results.filter(r=>r.ok).length;
  const missed={}; T.results.filter(r=>!r.ok).forEach(r=>missed[r.topic]=(missed[r.topic]||0)+1);
  const worst=Object.keys(missed).sort((a,b)=>missed[b]-missed[a])[0];
  const p=total?score/total:0;
  const msg=p===1?'Clean sweep.':p>=0.7?'Solid. The misses come back sooner so they stick.':p>=0.4?'Getting there. Reread the topic you missed most, then go again.':'Rough one — that\'s what this is for. Read the lesson first, then drill it.';
  return `<p class="score num" style="color:${p>=0.7?'var(--up)':'var(--down)'}">${score}/${total}</p>
  <p class="sub" style="font-size:18px;color:var(--ink)">${msg}</p>
  ${worst?`<div class="missed"><p class="muted">Missed:</p><ul>${Object.keys(missed).map(k=>`<li>${topicById(k).name} (${missed[k]})</li>`).join('')}</ul></div>
  <button class="btn btn-primary" data-action="lesson" data-topic="${worst}">Relearn ${topicById(worst).name}</button>
  <button class="btn btn-ghost" data-action="home">Done</button>`
  :`<button class="btn btn-primary" style="margin-top:24px" data-action="home">Done</button>`}`;
}

/* ---------- actions ---------- */
function startTrain(mode,topic){
  const cards=pickCards(mode,topic);
  if(!cards.length){ view.screen='home'; render(); return; }
  view.train={qs:cards.map(makeQ),i:0,picked:null,results:[],from:view.screen};
  view.screen='train'; render(); window.scrollTo(0,0);
}
function finishTrain(){
  const T=view.train;
  if(T.results.length>=3){ state.sessions.push({t:Date.now(),score:T.results.filter(r=>r.ok).length,total:T.results.length}); if(state.sessions.length>200)state.sessions=state.sessions.slice(-200); save(); }
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]'); if(!el) return;
  const a=el.dataset.action;
  if(a!=='reset') view.confirmReset=false;
  if(a!=='restore') view.restoreMsg='';
  if(a==='tab'){view.tab=el.dataset.tab;view.screen=el.dataset.tab;render();window.scrollTo(0,0);}
  else if(a==='lesson'){view.topic=el.dataset.topic;view.tab='learn';view.screen='lesson';render();window.scrollTo(0,0);}
  else if(a==='back'||a==='home'){view.screen=a==='back'?'learn':'home';view.tab=view.screen;render();window.scrollTo(0,0);}
  else if(a==='train'){startTrain(el.dataset.mode,el.dataset.topic);}
  else if(a==='answer'){
    const T=view.train; if(T.picked!==null) return;
    T.picked=+el.dataset.i; const q=T.qs[T.i], ok=T.picked===q.correct;
    T.results.push({topic:q.topic,ok}); grade(q.id,ok); render();
  }
  else if(a==='next'){
    const T=view.train;
    if(T.i+1<T.qs.length){T.i++;T.picked=null;render();window.scrollTo(0,0);}
    else {finishTrain();view.screen='summary';render();window.scrollTo(0,0);}
  }
  else if(a==='quit'){finishTrain();view.screen='home';view.tab='home';render();}
  else if(a==='restore'){
    const v=(document.getElementById('restoreBox').value||'').trim();
    try{ applyLoaded(atob(v)); save(); view.restoreMsg='Restored.'; view.restoreOk=true; }
    catch(err){ view.restoreMsg='That code didn\'t work. Copy the whole thing and try again.'; view.restoreOk=false; }
    render();
  }
  else if(a==='reset'){
    if(!view.confirmReset){view.confirmReset=true;render();return;}
    state={cards:{},sessions:[]};view.confirmReset=false;save();render();
  }
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('candle')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
});
load();
</script>
